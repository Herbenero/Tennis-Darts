<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tennis Darts with Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #d0e8d0;
      --bg2: #c0d8c0;
      --court: #b0c8b0;
      --line: #5f7a5f;
      --panel: rgba(255, 255, 255, 0.88);
      --text: #1f3a1f;
      --muted: #5f7a5f;
      --green: #4a7a4a;
      --green-2: #6aa96a;
      --gold: #a6b64d;
      --shadow: 0 20px 50px rgba(73, 100, 22, 0.12);
      --radius: 24px;
      --radius-sm: 16px;
      --max: 1480px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 15% 10%, rgba(74, 122, 74, 0.12), transparent 28%), radial-gradient(circle at 85% 10%, rgba(107, 140, 107, 0.1), transparent 24%), linear-gradient(180deg, var(--bg) 0%, var(--bg2) 55%, var(--court) 100%);
    }
    .app {
      width: min(var(--max), calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 42px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 20px;
    }
    .brand {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.45)), linear-gradient(135deg, #f9f2e3, #e7dbc4);
      border: 1px solid rgba(95, 78, 53, 0.14);
      box-shadow: var(--shadow);
      font-size: 1.8rem;
    }
    .brand h1 {
      margin: 0;
      font-family: "Anton", sans-serif;
      font-size: clamp(2.3rem, 5vw, 4.6rem);
      line-height: 0.92;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(95, 78, 53, 0.12);
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 800;
      font-size: 0.8rem;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(122, 160, 95, 0.12);
    }
    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid rgba(95, 78, 53, 0.12);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      padding: 24px;
      margin-bottom: 20px;
    }
    h3 {
      margin: 0 0 14px;
      font-family: "Anton", sans-serif;
      font-size: 1.8rem;
      line-height: 1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-weight: 800;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    select, input[type="text"], textarea {
      width: 100%;
      border: 1px solid rgba(95, 78, 53, 0.12);
      background: #fffaf0;
      border-radius: 16px;
      padding: 14px 18px;
      font: inherit;
      font-weight: 700;
      color: var(--text);
      outline: none;
    }
    textarea { min-height: 90px; resize: vertical; }
    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      font: inherit;
      font-weight: 800;
      border-radius: 16px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.54);
      border: 1px solid rgba(95, 78, 53, 0.12);
      width: 100%;
      transition: transform 0.16s ease, filter 0.16s ease;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .btn-primary {
      background: linear-gradient(135deg, var(--green), var(--green-2));
      color: #11200a;
      border-color: transparent;
      box-shadow: 0 14px 28px rgba(122, 160, 95, 0.2);
    }
    .btn-league {
      background: linear-gradient(180deg, #48bb78, #2f855a);
      color: #ffffff;
      border: 1px solid rgba(104, 211, 145, 0.6);
      box-shadow: 0 4px 14px rgba(56, 161, 105, 0.35);
      width: 100%;
      padding: 13px 18px;
      font-weight: 800;
      border-radius: 16px;
      cursor: pointer;
    }
    .league-submit-bar {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(95, 78, 53, 0.16);
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }
    .league-submit-bar label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 2px;
    }
    .league-sync-status {
      color: var(--green);
      font-weight: 700;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 4px;
    }
    .court-board {
      display: grid;
      gap: 16px;
    }
    .player-court-card {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(95, 78, 53, 0.14);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .player-court-card.active {
      border-color: var(--green);
      background: rgba(122, 160, 95, 0.12);
    }
    .court-stats {
      font-family: "Anton", sans-serif;
      font-size: 1.8rem;
      color: var(--green);
    }
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(31, 58, 31, 0.62);
      backdrop-filter: blur(10px);
      z-index: 50;
    }
    .modal.open { display: grid; }
    .modal-card {
      width: min(640px, 100%);
      border-radius: var(--radius);
      border: 1px solid rgba(95, 78, 53, 0.18);
      background: radial-gradient(circle at top, rgba(122, 160, 95, 0.18), transparent 35%), linear-gradient(180deg, #f7f3e8 0%, #edf4ed 100%);
      box-shadow: var(--shadow);
      padding: 26px;
      text-align: center;
    }
    .modal-card h2 {
      font-family: "Anton", sans-serif;
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      color: var(--green);
      margin: 0;
    }
    @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">🎾</div>
        <div>
          <h1>Tennis Darts</h1>
          <p>Hellcastle Archery Arena Edition</p>
        </div>
      </div>
      <div class="badge"><span class="dot"></span>Ready for Match</div>
    </div>

    <div class="layout">
      <!-- SETUP PANEL -->
      <div class="panel">
        <h3>Match Setup</h3>
        <div class="form-group">
          <label for="playerNames">Players (Add exactly 2 players)</label>
          <input type="text" id="player1Input" placeholder="Player 1 Name" value="Kelly" style="margin-bottom: 10px;" />
          <input type="text" id="player2Input" placeholder="Player 2 Name" value="Herb" />
        </div>
        <div class="form-group" style="margin-top: 14px;">
          <label for="setsToWin">Sets to Win Match</label>
          <select id="setsToWin">
            <option value="1">1 Set</option>
            <option value="3" selected>Best of 3 Sets</option>
            <option value="5">Best of 5 Sets</option>
          </select>
        </div>
        <button class="btn btn-primary" id="startBtn" type="button">Start Game</button>
      </div>

      <!-- GAME / COURT BOARD PANEL -->
      <div class="panel" id="gamePanel">
        <h3>Court Live View</h3>
        <div id="courtStatus" class="court-board">
          <div style="color: var(--muted); padding: 20px 0; text-align: center;">
            Enter 2 players and click Start Game to load the court.
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- WINNER & LEAGUE SUBMISSION MODAL -->
  <div class="modal" id="winnerModal" aria-hidden="true">
    <div class="modal-card">
      <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--gold); font-weight: 800;">Grand Slam Result</div>
      <h2 id="winnerTitle">Set & Match</h2>
      <div id="winnerSummary" style="color: var(--muted); margin-top: 10px; font-size: 1.05rem;"></div>

      <div class="league-submit-bar">
        <label for="targetLeagueSelect">Select Target League:</label>
        <select id="targetLeagueSelect" aria-label="Target League">
          <option value="Royal Couple">Royal Couple</option>
          <option value="Papal 1">Papal 1</option>
          <option value="Faubion 1">Faubion 1</option>
        </select>
        <button class="btn-league" id="sendToLeagueBtn" type="button">🚀 Send to League Form</button>
        <span class="league-sync-status" id="leagueSyncStatus"></span>
      </div>

      <div style="margin-top: 18px;">
        <button class="btn" id="closeModalBtn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBvL2K8R82qk3fG4EEKZ6sOIiieLcCKckA",
      authDomain: "haal-fc862.firebaseapp.com",
      projectId: "haal-fc862",
      storageBucket: "haal-fc862.firebasestorage.app",
      messagingSenderId: "1077392905739",
      appId: "1:1077392905739:web:cc047fae886356663fd90e",
      measurementId: "G-P99RVN1XBF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const LEAGUE_URL = "https://herbenero.github.io/Hellcastle-League/";

    window.players = [];

    async function loadSavedLeagues() {
      const select = document.getElementById("targetLeagueSelect");
      if (!select) return;
      try {
        const snapshot = await getDocs(collection(db, "leagues"));
        const seen = new Set();
        const options = [];

        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          const rawName = (data.leagueName || docSnap.id || "").trim();
          const norm = rawName.toLowerCase().replace(/[^a-z0-9]/g, "");
          if (rawName && !seen.has(norm)) {
            seen.add(norm);
            options.push(rawName);
          }
        });

        if (options.length > 0) {
          const prevVal = localStorage.getItem("haalis_selected_target_league") || select.value;
          select.innerHTML = options
            .map(name => `<option value="${name.replace(/"/g, "&quot;")}">${name.replace(/"/g, '&quot;')}</option>`)
            .join("");
          const matched = options.find(o => o.toLowerCase() === prevVal.toLowerCase());
          if (matched) select.value = matched;
        }
      } catch (err) {
        console.error("Failed to fetch leagues from Firestore:", err);
      }
    }

    function renderBoard() {
      const container = document.getElementById("courtStatus");
      if (!window.players.length) {
        container.innerHTML = `<div style="color: var(--muted); padding: 20px 0; text-align: center;">Enter 2 players and click Start Game to load the court.</div>`;
        return;
      }
      container.innerHTML = window.players.map((p, idx) => `
        <div class="player-court-card ${idx === 0 ? 'active' : ''}">
          <div>
            <div style="font-weight: 800; font-size: 1.1rem;">${p.name}</div>
            <div style="font-size: 0.85rem; color: var(--muted);">Games Won: ${p.gamesWon} | Games Lost: ${p.gamesLost}</div>
          </div>
          <div class="court-stats">${p.score} Sets</div>
        </div>
      `).join("");
    }

    function sendToLeagueForm() {
      const activePlayers = window.players;
      if (!activePlayers.length) {
        alert("No player results available to send.");
        return;
      }

      const select = document.getElementById("targetLeagueSelect");
      const selectedLeague = select ? select.value.trim() : "Royal Couple";
      localStorage.setItem("haalis_selected_target_league", selectedLeague);

      const rankedPlayers = [...activePlayers]
        .map(p => {
          const won = Number(p.gamesWon ?? 0);
          const lost = Number(p.gamesLost ?? 0);
          return {
            name: p.name.trim(),
            score: Number(p.score ?? won),
            notes: `${won} games won, ${lost} games lost`
          };
        })
        .sort((a, b) => b.score - a.score);

      const payload = {
        leagueName: selectedLeague,
        event: "Tennis Darts",
        timestamp: new Date().toISOString(),
        players: rankedPlayers
      };

      try {
        localStorage.setItem("haalis_pending_match", JSON.stringify(payload));
      } catch (e) {
        console.warn("localStorage unavailable:", e);
      }

      const statusEl = document.getElementById("leagueSyncStatus");
      if (statusEl) statusEl.textContent = `Sending results to ${selectedLeague}...`;

      const targetUrl = new URL(LEAGUE_URL);
      targetUrl.searchParams.set("league", selectedLeague);
      targetUrl.searchParams.set("event", "Tennis Darts");
      targetUrl.searchParams.set("match", JSON.stringify(payload));
      window.location.href = targetUrl.toString();
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      const p1 = document.getElementById("player1Input").value.trim() || "Player 1";
      const p2 = document.getElementById("player2Input").value.trim() || "Player 2";
      
      window.players = [
        { name: p1, gamesWon: 2, gamesLost: 1, score: 2 },
        { name: p2, gamesWon: 1, gamesLost: 2, score: 1 }
      ];
      renderBoard();

      // Open modal to test league submission
      document.getElementById("winnerModal").classList.add("open");
    });

    document.getElementById("sendToLeagueBtn").addEventListener("click", sendToLeagueForm);
    document.getElementById("closeModalBtn").addEventListener("click", () => {
      document.getElementById("winnerModal").classList.remove("open");
    });

    loadSavedLeagues();
    renderBoard();
  </script>
</body>
</html>
