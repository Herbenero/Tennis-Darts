<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tennis Darts with Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #d0e8d0;
      --bg2: #c0d8c0;
      --court: #b0c8b0;
      --line: #5f7a5f;
      --panel: rgba(255, 255, 255, 0.85);
      --panel-2: rgba(255, 255, 255, 0.48);
      --text: #1f3a1f;
      --muted: #5f7a5f;
      --green: #4a7a4a;
      --green-2: #6aa96a;
      --clay: #8b6f52;
      --gold: #a6b64d;
      --danger: #c54c4c;
      --shadow: 0 20px 50px rgba(73, 100, 22, 0.12);
      --radius: 24px;
      --radius-sm: 16px;
      --max: 1480px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 15% 10%, rgba(74, 122, 74, 0.12), transparent 28%), radial-gradient(circle at 85% 10%, rgba(107, 140, 107, 0.1), transparent 24%), linear-gradient(180deg, var(--bg) 0%, var(--bg2) 55%, var(--court) 100%);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(95, 122, 95, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(95, 122, 95, 0.03) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.05));
      z-index: 0;
    }
    .app {
      position: relative;
      z-index: 1;
      width: min(var(--max), calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 42px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 20px;
    }
    .brand {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.45)), linear-gradient(135deg, #f9f2e3, #e7dbc4);
      border: 1px solid rgba(95, 78, 53, 0.14);
      box-shadow: var(--shadow);
    }
    .brand h1 {
      margin: 0;
      font-family: "Anton", sans-serif;
      font-size: clamp(2.3rem, 5vw, 4.6rem);
      line-height: 0.92;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(95, 78, 53, 0.12);
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 800;
      font-size: 0.8rem;
      white-space: nowrap;
      box-shadow: var(--shadow);
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(122, 160, 95, 0.12);
    }
    .hero {
      display: grid;
      grid-template-columns: 1.1fr 1.2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid rgba(95, 78, 53, 0.12);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
    }
    .intro {
      padding: 28px;
      position: relative;
      isolation: isolate;
    }
    .intro::after {
      content: "";
      position: absolute;
      right: -70px;
      bottom: -70px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(122, 160, 95, 0.16), transparent 68%);
      filter: blur(8px);
      z-index: -1;
    }
    .eyebrow {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(95, 78, 53, 0.12);
      background: rgba(255, 255, 255, 0.45);
      color: var(--gold);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 800;
    }
    .intro h2 {
      margin: 16px 0 12px;
      font-family: "Anton", sans-serif;
      font-size: clamp(2.8rem, 7vw, 5.6rem);
      line-height: 0.92;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      max-width: 11ch;
    }
    .intro p {
      color: var(--muted);
      line-height: 1.72;
      max-width: 68ch;
      margin: 0;
    }
    .rule-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 22px;
    }
    .rule {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.46);
      border: 1px solid rgba(95, 78, 53, 0.08);
      min-height: 132px;
    }
    .rule strong {
      display: block;
      color: var(--green);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.82rem;
    }
    .rule span {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
    }
    .side {
      display: grid;
      gap: 20px;
      align-content: start;
    }
    .box {
      padding: 22px;
    }
    h3 {
      margin: 0 0 14px;
      font-family: "Anton", sans-serif;
      font-size: 2rem;
      line-height: 1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-weight: 800;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
      cursor: pointer;
      border-radius: 4px;
    }
    select {
      width: 100%;
      border: 1px solid rgba(95, 78, 53, 0.12);
      background: #fffaf0;
      border-radius: 16px;
      padding: 14px 18px;
      font: inherit;
      font-weight: 700;
      color: var(--text);
      outline: none;
      transition: 0.2s ease;
    }
    select:focus {
      border-color: rgba(122, 160, 95, 0.45);
      box-shadow: 0 0 0 4px rgba(122, 160, 95, 0.12);
    }
    .player-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 14px;
    }
    input[type="text"] {
      width: 100%;
      outline: none;
      color: var(--text);
      background: #fffaf0;
      border: 1px solid rgba(95, 78, 53, 0.12);
      border-radius: 16px;
      padding: 16px 18px;
      font: inherit;
      transition: 0.2s ease;
    }
    input[type="text"]:focus {
      border-color: rgba(122, 160, 95, 0.45);
      box-shadow: 0 0 0 4px rgba(122, 160, 95, 0.12);
      transform: translateY(-1px);
    }
    .btn, .control-btn, .grid-btn, .mini-btn {
      appearance: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      font: inherit;
      font-weight: 800;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }
    .btn:hover, .control-btn:hover, .grid-btn:hover, .mini-btn:hover {
      transform: translateY(-2px);
    }
    .btn:active, .control-btn:active, .grid-btn:active, .mini-btn:active {
      transform: translateY(1px) scale(0.985);
    }
    .btn {
      border-radius: 16px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.54);
      border: 1px solid rgba(95, 78, 53, 0.12);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--green), var(--green-2));
      color: #11200a;
      border-color: transparent;
      box-shadow: 0 14px 28px rgba(122, 160, 95, 0.2);
    }
    .btn-league {
      background: linear-gradient(180deg, #48bb78, #2f855a);
      color: #ffffff;
      border: 1px solid rgba(104, 211, 145, 0.6);
      box-shadow: 0 4px 14px rgba(56, 161, 105, 0.35);
      width: 100%;
      padding: 13px 18px;
      font-weight: 800;
      border-radius: 16px;
      cursor: pointer;
    }
    .btn-league:hover {
      filter: brightness(1.06);
    }
    .league-submit-bar {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(95, 78, 53, 0.16);
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }
    .league-submit-bar label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 2px;
    }
    .league-submit-bar select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(95, 78, 53, 0.12);
      background: #fffaf0;
      color: var(--text);
      font: inherit;
      font-weight: 700;
      outline: none;
    }
    .league-sync-status {
      color: var(--green);
      font-weight: 700;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 4px;
    }
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(31, 58, 31, 0.62);
      backdrop-filter: blur(10px);
      z-index: 50;
    }
    .modal.open {
      display: grid;
    }
    .modal-card {
      width: min(640px, 100%);
      border-radius: var(--radius);
      border: 1px solid rgba(95, 78, 53, 0.18);
      background: radial-gradient(circle at top, rgba(122, 160, 95, 0.18), transparent 35%), linear-gradient(180deg, #f7f3e8 0%, #edf4ed 100%);
      box-shadow: var(--shadow);
      padding: 26px;
      text-align: center;
    }
    .modal-card h2 {
      font-family: "Anton", sans-serif;
      font-size: clamp(2.4rem, 5vw, 3.80rem);
      color: var(--green);
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">🎾</div>
        <div>
          <h1>Tennis Darts</h1>
          <p>Hellcastle Archery Arena Edition</p>
        </div>
      </div>
      <div class="badge"><span class="dot"></span>Ready for Match</div>
    </div>

    <!-- MAIN APP CONTENT (Placeholder / Core structure hook) -->
    <div class="hero">
      <section class="panel intro">
        <div class="eyebrow">Grand Slam Rules</div>
        <h2>Break the Board</h2>
        <p>Serve, rally, and hold your service games to take the set and match.</p>
      </section>
    </div>
  </div>

  <!-- WINNER & LEAGUE SUBMISSION MODAL -->
  <div class="modal" id="winnerModal" aria-hidden="true">
    <div class="modal-card">
      <div class="eyebrow">Match Complete</div>
      <h2 id="winnerTitle">Set & Match</h2>
      <div id="winnerSummary" style="color: var(--muted); margin-top: 10px; font-size: 1.05rem;"></div>

      <div class="league-submit-bar">
        <label for="targetLeagueSelect">Select Target League:</label>
        <select id="targetLeagueSelect" aria-label="Target League">
          <option value="Royal Couple">Royal Couple</option>
          <option value="Papal 1">Papal 1</option>
          <option value="Faubion 1">Faubion 1</option>
        </select>
        <button class="btn-league" id="sendToLeagueBtn" type="button">🚀 Send to League Form</button>
        <span class="league-sync-status" id="leagueSyncStatus"></span>
      </div>

      <div style="margin-top: 18px;">
        <button class="btn" id="closeModalBtn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBvL2K8R82qk3fG4EEKZ6sOIiieLcCKckA",
      authDomain: "haal-fc862.firebaseapp.com",
      projectId: "haal-fc862",
      storageBucket: "haal-fc862.firebasestorage.app",
      messagingSenderId: "1077392905739",
      appId: "1:1077392905739:web:cc047fae886356663fd90e",
      measurementId: "G-P99RVN1XBF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const LEAGUE_URL = "https://herbenero.github.io/Hellcastle-League/";

    async function loadSavedLeagues() {
      const select = document.getElementById("targetLeagueSelect");
      if (!select) return;
      try {
        const snapshot = await getDocs(collection(db, "leagues"));
        const seen = new Set();
        const options = [];

        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          const rawName = (data.leagueName || docSnap.id || "").trim();
          const norm = rawName.toLowerCase().replace(/[^a-z0-9]/g, "");
          if (rawName && !seen.has(norm)) {
            seen.add(norm);
            options.push(rawName);
          }
        });

        if (options.length > 0) {
          const prevVal = localStorage.getItem("haalis_selected_target_league") || select.value;
          select.innerHTML = options
            .map(name => `<option value="${name.replace(/"/g, "&quot;")}">${name.replace(/"/g, '&quot;')}</option>`)
            .join("");
          const matched = options.find(o => o.toLowerCase() === prevVal.toLowerCase());
          if (matched) select.value = matched;
        }
      } catch (err) {
        console.error("Failed to fetch leagues from Firestore:", err);
      }
    }

    function sendToLeagueForm() {
      // Access player state (supports standard tennis darts player records with wins / losses or sets won)
      const activePlayers = typeof players !== "undefined" ? players : (window.state && window.state.players) || [];
      if (!activePlayers.length) {
        alert("No player results available to send.");
        return;
      }

      const select = document.getElementById("targetLeagueSelect");
      const selectedLeague = select ? select.value.trim() : "Royal Couple";
      localStorage.setItem("haalis_selected_target_league", selectedLeague);

      const rankedPlayers = [...activePlayers]
        .map(p => {
          const wins = Number(p.wins ?? p.matchesWon ?? p.setsWon ?? 0);
          const losses = Number(p.losses ?? p.matchesLost ?? p.setsLost ?? 0);
          const totalScore = Number(p.score ?? p.points ?? wins);

          return {
            name: (p.name || "").trim(),
            score: totalScore,
            notes: `${wins} wins, ${losses} losses`
          };
        })
        .sort((a, b) => b.score - a.score);

      const payload = {
        leagueName: selectedLeague,
        event: "Tennis Darts",
        timestamp: new Date().toISOString(),
        players: rankedPlayers
      };

      try {
        localStorage.setItem("haalis_pending_match", JSON.stringify(payload));
      } catch (e) {
        console.warn("localStorage unavailable, relying on URL payload:", e);
      }

      const statusEl = document.getElementById("leagueSyncStatus");
      if (statusEl) {
        statusEl.textContent = `Sending results to ${selectedLeague}...`;
      }

      const targetUrl = new URL(LEAGUE_URL);
      targetUrl.searchParams.set("league", selectedLeague);
      targetUrl.searchParams.set("event", "Tennis Darts");
      targetUrl.searchParams.set("match", JSON.stringify(payload));
      window.location.href = targetUrl.toString();
    }

    document.getElementById("sendToLeagueBtn").addEventListener("click", sendToLeagueForm);
    document.getElementById("closeModalBtn").addEventListener("click", () => {
      document.getElementById("winnerModal").classList.remove("open");
    });

    loadSavedLeagues();
  </script>
</body>
</html>
